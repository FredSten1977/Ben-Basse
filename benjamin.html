<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Benjamin FC">
<link rel="apple-touch-icon" href="icon-benjamin.png">
<style>[hidden]{display:none!important}</style>
<title>Benjamin FC Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&family=Bungee&display=swap">
<style>
/* Layout: nattkamp på stadion. Lystavle øverst, gressbane med spørsmålskort, fire store svarknapper. Ett bevisst mørkt tema. */
:root{
  --night:#0b1f17;
  --grass:#1f7a3f;
  --grass-2:#1a6b37;
  --chalk:#f4f7ef;
  --ink:#10221a;
  --led:#ffd23f;
  --led-dim:#5c4a12;
  --red:#e8443a;
  --yellow:#ffc928;
  --sky:#7fd3ff;
  --font-display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-read:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --font-board:"Bungee","Impact",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--font-read);font-size:18px;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(255,255,220,.18),transparent 55%);}
.wrap{max-width:720px;margin:0 auto;padding:16px;padding-block:12px 24px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}

/* Lystavle */
.board{background:#050d09;border:3px solid #24392e;border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;box-shadow:0 0 30px rgba(255,210,63,.08)}
.team{font-family:var(--font-display);font-size:clamp(15px,4vw,22px);line-height:1.1;min-width:0}
.team.away{text-align:right;color:#ffb3ad}
.team.home{color:var(--sky)}
.score{font-family:var(--font-board);color:var(--led);font-size:clamp(30px,9vw,46px);letter-spacing:.06em;text-shadow:0 0 12px rgba(255,210,63,.55);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta{grid-column:1/-1;display:flex;justify-content:space-between;font-family:var(--font-board);font-size:12px;color:var(--led-dim);letter-spacing:.08em}
.meta b{color:var(--led);font-weight:400}

/* Bane */
.pitch{position:relative;border-radius:16px;padding:18px 16px;background:repeating-linear-gradient(90deg,var(--grass) 0 48px,var(--grass-2) 48px 96px);border:3px solid rgba(244,247,239,.75);overflow:hidden}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:140px;height:140px;border:3px solid rgba(244,247,239,.35);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.pitch::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid rgba(244,247,239,.35);pointer-events:none}

.qcard{position:relative;z-index:1;background:var(--chalk);color:var(--ink);border-radius:14px;padding:16px 16px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.qtext{flex:1;min-width:0;font-size:clamp(20px,5vw,26px);line-height:1.35;font-weight:700;text-wrap:balance}
.listen{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--led);display:grid;place-items:center;cursor:pointer}
.listen svg{width:28px;height:28px}
.listen.speaking{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,210,63,.35)}}

.hint{position:relative;z-index:1;text-align:center;font-family:var(--font-display);font-size:18px;margin-top:14px;min-height:1.4em;text-shadow:0 2px 0 rgba(0,0,0,.35)}

.answers{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ans{position:relative;overflow:hidden;font-family:var(--font-read);font-weight:700;font-size:clamp(22px,6vw,30px);color:var(--ink);background:#fff;border:0;border-radius:14px;min-height:88px;padding:12px 10px;cursor:pointer;box-shadow:0 5px 0 #b9c4b3;transition:transform .12s,opacity .3s,filter .3s;word-break:break-word;hyphens:auto}
.ans:active{transform:translateY(3px);box-shadow:0 2px 0 #b9c4b3}
.ans:focus-visible{outline:4px solid var(--led);outline-offset:3px}
.ans[disabled]{cursor:default}
.ans.hidden-text{color:transparent;text-shadow:none}
.ans.hidden-text::before{content:"";position:absolute;inset:30% 18%;border-radius:8px;background:repeating-linear-gradient(90deg,#dfe6da 0 14px,transparent 14px 20px)}
.ans .bar{position:absolute;left:0;bottom:0;height:6px;width:0;background:var(--led)}
.ans.locked{filter:saturate(.6) brightness(.92)}
.ans.wrong{background:#ffd9d6;color:#8a1f18;text-decoration:line-through;box-shadow:0 5px 0 #d79d97;opacity:.75}
.ans.right{background:#c9f7c3;box-shadow:0 5px 0 #6cbf63;animation:pop .45s}
@keyframes pop{40%{transform:scale(1.08)}}
.ans .reading{border-radius:6px;transition:background .2s}
.ans.say .reading{background:var(--led)}

.next{align-self:center;font-family:var(--font-display);font-size:24px;background:var(--led);color:var(--ink);border:0;border-radius:999px;padding:14px 34px;cursor:pointer;box-shadow:0 5px 0 #a8861c}
.next:focus-visible{outline:4px solid var(--chalk);outline-offset:3px}

/* Overlegg: mål / kort */
.flash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5;background:rgba(5,13,9,.72);text-align:center;padding:16px}
.flash[hidden]{display:none}
.flash .msg{font-family:var(--font-display);font-size:clamp(54px,16vw,110px);color:var(--led);text-shadow:0 6px 0 #000,0 0 40px rgba(255,210,63,.6);animation:boom .9s ease-out both}
.flash .card{width:110px;height:150px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:cardin .7s ease-out both}
.flash .card.y{background:var(--yellow)}
.flash .card.r{background:var(--red)}
.flash .sub{font-family:var(--font-display);font-size:28px;margin-top:14px;text-align:center;text-shadow:0 3px 0 #000}
.rimg{width:100%;max-height:150px;object-fit:cover;border-radius:10px;margin-bottom:4px}
.rung.locked .rimg{filter:saturate(.7) brightness(.85)}
.ringimg{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);border-radius:50%;object-fit:cover}
.nextcard .ring span.pct-badge{position:absolute;bottom:-4px;right:-6px;background:var(--led);color:#10221a;font-size:14px;border-radius:99px;padding:2px 7px}
.party-img{width:min(260px,70vw);max-width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;border:5px solid var(--led);box-shadow:0 0 40px rgba(255,210,63,.8);animation:glow2 1.4s ease-in-out infinite}
.pthumb{width:56px;height:56px;object-fit:cover;border-radius:10px}
.imgbtn{font-size:15px;background:rgba(127,127,127,.2);border-radius:8px;padding:8px 12px;cursor:pointer}
@keyframes boom{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes cardin{0%{transform:translateY(60px) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}

/* Start / slutt */
.screen{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;padding-block:24px}
.crest{width:120px;height:120px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,11vw,64px);line-height:1;margin:0;color:var(--chalk);text-shadow:0 5px 0 var(--grass-2)}
.rules{display:grid;gap:10px;max-width:440px;text-align:left;font-size:20px;line-height:1.4}
.rule{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px}
.rule i{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--font-board);font-size:15px;background:var(--led);color:var(--ink)}
.final{font-family:var(--font-board);font-size:clamp(40px,12vw,64px);color:var(--led);text-shadow:0 0 18px rgba(255,210,63,.5)}
.note{font-size:15px;opacity:.7;max-width:440px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:520px}
.mode{font-family:var(--font-display);font-size:26px;color:var(--ink);background:var(--c);border:0;border-radius:16px;padding:18px 12px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.mode small{display:block;font-family:var(--font-read);font-size:14px;font-weight:700;opacity:.7;margin-top:2px}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.mode:focus-visible{outline:4px solid var(--chalk);outline-offset:3px}
.pts{width:100%;max-width:520px;background:#050d09;border:3px solid #24392e;border-radius:12px;padding:12px;display:grid;gap:10px;box-sizing:border-box}
.pts-total{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display);font-size:22px}
.pts-total b{font-family:var(--font-board);font-weight:400;font-size:40px;color:var(--led);text-shadow:0 0 12px rgba(255,210,63,.55)}
.pts-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.pts-row span{display:block;font-size:15px;opacity:.75}
.pts-row b{font-family:var(--font-board);font-weight:400;font-size:24px}


.fact{position:relative;z-index:1;margin-top:14px;background:rgba(5,13,9,.82);border-left:6px solid var(--led);border-radius:10px;padding:12px 14px;font-size:20px;line-height:1.45}
.ladder{width:100%;max-width:520px;display:grid;gap:14px;text-align:left}
.ladder h3{margin:0;text-align:center}
.nextcard{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#123826,#0a1d14);border:2px solid rgba(255,210,63,.45);border-radius:18px;padding:14px 16px;box-shadow:0 0 30px rgba(255,210,63,.12)}
.nextcard .ring{position:relative;flex:none;width:96px;height:96px;display:grid;place-items:center;color:var(--led)}
.nextcard .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:10}
.ring-fg{fill:none;stroke:var(--led);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,210,63,.7));transition:stroke-dashoffset 1.2s ease-out}
.nextcard .ring span{font-family:var(--font-board);font-size:22px;color:var(--led)}
.nextcard.done .ring svg{position:static;transform:none;width:60px;height:60px}
.nc-text{display:grid;gap:2px;min-width:0}
.nc-text small,.nextcard small{font-size:15px;opacity:.75;text-transform:uppercase;letter-spacing:.08em}
.nc-text b,.nextcard b{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.nc-text em{font-style:normal;color:var(--led);font-weight:700;font-size:18px}
.track{display:grid}
.rung{position:relative;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding-block:7px}
.rung::before,.rung::after{content:"";position:absolute;left:28px;width:8px;background:rgba(255,255,255,.12)}
.rung::before{top:0;height:50%}.rung::after{top:50%;bottom:0}
.rung.first::before,.rung.last::after{display:none}
.rung.gt::before,.rung.gb::after{background:linear-gradient(180deg,#ffe27a,var(--led));box-shadow:0 0 10px rgba(255,210,63,.6)}
.node{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#1b2e24;border:3px solid rgba(255,255,255,.25);color:rgba(255,255,255,.55)}
.node svg{width:32px;height:32px}
.rung.open .node{background:radial-gradient(circle at 35% 30%,#fff3b0,var(--led) 55%,#c9971c);border-color:#fff3b0;color:#5c3d00;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 26px rgba(255,210,63,.9)}}
.rung.given .node{background:var(--grass);border-color:#7dd08f;color:#e9ffe9}
.node.ball{background:none;border:0;width:64px;height:64px}
.node.ball svg{width:46px;height:46px;animation:bounce 1.1s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
@keyframes bounce{50%{transform:translateY(-7px) rotate(25deg)}}
.me-body b{font-family:var(--font-display);font-weight:400;font-size:24px;color:var(--sky);display:block}
.me-body small{font-size:15px;opacity:.8}
.rung-body{position:relative;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 14px 10px 14px;display:grid;gap:2px;min-width:0}
.rung-body b{font-size:21px;overflow-wrap:anywhere;padding-right:56px}
.rung-body small{font-size:15px;opacity:.8}
.pts-badge{position:absolute;z-index:2;right:16px;top:16px;font-family:var(--font-board);font-size:16px;background:rgba(10,20,15,.85);box-shadow:0 2px 8px rgba(0,0,0,.5);border-radius:99px;padding:2px 8px;color:var(--led)}
.rung.open .rung-body{background:rgba(255,210,63,.16);outline:2px solid var(--led)}
.rung.open small{color:var(--led);opacity:1;font-weight:700}
.rung.given{opacity:.6}
.party{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(22,48,32,.97),rgba(3,8,6,.98));padding:16px}
.party canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.party-card{position:relative;display:grid;justify-items:center;gap:6px;text-align:center;max-width:420px;animation:boom .8s ease-out both}
.party-trophy{width:120px;height:120px;color:var(--led);filter:drop-shadow(0 0 24px rgba(255,210,63,.9));animation:glow2 1.4s ease-in-out infinite}
.party-trophy svg{width:100%;height:100%}
@keyframes glow2{50%{transform:scale(1.08) rotate(-4deg)}}
.party-card small{font-family:var(--font-display);font-size:24px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.party-card b{font-family:var(--font-display);font-weight:400;font-size:clamp(36px,10vw,56px);line-height:1.05;color:var(--led);text-shadow:0 4px 0 #000;overflow-wrap:anywhere}
.party-card p{font-size:20px;margin:6px 0 10px}
.meter.thin{height:8px}
.tasks{width:100%;max-width:520px;display:grid;gap:10px}
.tasks h3{margin:0;text-align:center}
.task{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;font:inherit;font-size:21px;font-weight:700;color:var(--ink);background:var(--chalk);border:0;border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:0 5px 0 #9fae99}
.task b{font-family:var(--font-board);font-weight:400;font-size:24px;color:var(--grass-2)}
.task small{grid-column:1/-1;font-size:15px;font-weight:700}
.task:active{transform:translateY(3px);box-shadow:0 2px 0 #9fae99}
.task:focus-visible{outline:4px solid var(--led);outline-offset:3px}
.task.pending{background:#fff3c4;box-shadow:0 5px 0 #d9c376;cursor:default}
.task.approved{background:#c9f7c3;box-shadow:0 5px 0 #6cbf63;cursor:default}
.pts-bonus{display:flex;justify-content:space-between;border-top:1px solid #24392e;padding-top:8px;font-size:15px}
.pts-bonus b{font-family:var(--font-board);font-weight:400;font-size:20px;color:var(--led)}
.pill{display:inline-block;background:var(--red);color:#fff;border-radius:99px;padding:1px 8px;font-size:13px;margin-left:6px}
.acts button.ok{background:var(--grass)}
.plus{color:#7dffa0}.minus{color:#ff8f87}
.flash .sub.plus,.flash .sub.minus{font-size:34px;margin-top:6px}
.flash .col{display:grid;justify-items:center}
.flash .msg.mid{font-size:clamp(40px,11vw,72px)}
.pts-btn{color:var(--chalk);font:inherit;text-align:left;cursor:pointer}
.pts-btn:focus-visible{outline:4px solid var(--led);outline-offset:3px}
.pts-next{font-size:17px;opacity:.9}
.pts-next b{color:var(--led)}
.screen.left{align-items:stretch;text-align:left;max-width:560px;margin:0 auto;width:100%}
.screen h2{font-family:var(--font-display);font-weight:400;font-size:40px;margin:0}
.screen h3{font-family:var(--font-display);font-weight:400;font-size:28px;margin:8px 0 0}
.back{align-self:flex-start;background:none;border:0;color:var(--sky);font-family:var(--font-display);font-size:20px;cursor:pointer;padding:4px 0}
.level{background:rgba(255,255,255,.06);border-radius:14px;padding:14px;display:grid;gap:10px}
.level-top{display:flex;gap:12px;align-items:center}
.level-top b{display:block;font-family:var(--font-display);font-weight:400;font-size:26px}
.level-top small,.level>small{opacity:.75;font-size:15px}
.badge{flex:none;width:52px;height:52px;border-radius:50%;background:var(--led);color:var(--ink);display:grid;place-items:center;font-family:var(--font-board);font-size:22px}
.meter{height:14px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--led));border-radius:99px}
.prizes{display:grid;gap:10px}
.prize{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px}
.prize .at{grid-row:span 2;font-family:var(--font-board);font-size:20px;color:var(--led);min-width:52px;text-align:center}
.prize b{font-size:20px;min-width:0;overflow-wrap:anywhere}
.prize small{font-size:15px;opacity:.8}
.prize.open{background:rgba(255,210,63,.18);outline:2px solid var(--led)}
.prize.open small{color:var(--led);opacity:1;font-weight:700}
.prize.given{opacity:.6}
.prize.locked b{opacity:.85}
.prize .acts{grid-column:2}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{font:inherit;font-size:15px;background:rgba(255,255,255,.12);color:var(--chalk);border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.acts button.danger{background:var(--red)}
.parent-link{align-self:center;margin-top:18px;background:none;border:1px solid rgba(255,255,255,.3);color:var(--chalk);opacity:.75;border-radius:999px;padding:8px 18px;font:inherit;font-size:15px;cursor:pointer}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.form input{font:inherit;font-size:22px;padding:10px 12px;border-radius:10px;border:2px solid #24392e;background:#050d09;color:var(--chalk);width:100%;box-sizing:border-box}
.form label{display:grid;gap:4px;font-size:15px;width:110px}
.form label.grow{flex:1;min-width:180px;width:auto}
#pin{width:160px;letter-spacing:.4em;text-align:center}
.err{color:#ff8f87;min-height:1.2em;margin:0}
.delta{font-family:var(--font-display);font-size:26px;margin:0}
.unlock{background:rgba(255,210,63,.18);border:2px solid var(--led);border-radius:12px;padding:10px 16px;font-size:20px;margin:0}
.unlock b{color:var(--led)}
/* Skriving */
.typed{position:relative;z-index:1;margin-top:12px;background:#fff;color:var(--ink);border-radius:14px;min-height:72px;display:grid;place-items:center;font-weight:700;font-size:clamp(30px,9vw,44px);letter-spacing:.06em;box-shadow:0 5px 0 #b9c4b3;overflow-wrap:anywhere;padding:6px 12px}
.typed .ph{opacity:.25}
.typed.ok{background:#c9f7c3;box-shadow:0 5px 0 #6cbf63}
.typed.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.attempts{position:relative;z-index:1;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:8px;margin-top:8px;font-size:22px}
.attempts s{color:#ffd9d6;text-decoration-thickness:3px}
.answer-word{display:inline-block;background:var(--chalk);color:var(--ink);border-radius:8px;padding:2px 12px;font-family:var(--font-read);font-weight:700;font-size:30px;letter-spacing:.05em}
.kb{position:relative;z-index:1;display:grid;gap:6px;margin-top:12px}
.kb-row{display:flex;gap:5px;justify-content:center}
.key{flex:1 1 0;max-width:52px;min-width:0;height:50px;border:0;border-radius:8px;background:var(--chalk);color:var(--ink);font-family:var(--font-read);font-weight:700;font-size:22px;cursor:pointer;box-shadow:0 3px 0 #9fae99;padding:0}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #9fae99}
.key.wide{max-width:76px;flex-grow:1.5;background:#dfe6da}
.key.check{max-width:260px;flex:none;width:60%;background:var(--led);font-family:var(--font-display);font-weight:400;font-size:24px;box-shadow:0 4px 0 #a8861c}

@media (max-width:360px){.answers{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.quitrow{display:flex;justify-content:center;margin:22px 0 10px}

<script>
/* Lagring for den frittstående nettsiden: Supabase via to databasefunksjoner (fq_get, fq_set).
   Alle nøkler starter med en hemmelig familiekode som bare ligger i lenken (#k=...) og i nettleseren,
   aldri i koden på GitHub. Uten kode lagres alt bare i nettleseren. */
(function(){
  const URL_ = "https://ljohtyrxlqgqmoqqrhov.supabase.co", KEY = "sb_publishable_GdMXAQUSCTdZ6LtyaBBsYw_at-kQJ-j";
  let fam = null;
  try{
    const m = location.hash.match(/k=([A-Za-z0-9_-]{16,})/);
    if(m){ fam = m[1]; localStorage.setItem("familiekode", fam); }
    else { fam = localStorage.getItem("familiekode"); if(fam) history.replaceState(null, "", "#k="+fam); }
  }catch(e){}
  async function rpc(fn, body){
    const r = await fetch(`${URL_}/rest/v1/rpc/${fn}`, {method:"POST", headers:{"apikey":KEY, "Authorization":`Bearer ${KEY}`, "Content-Type":"application/json"}, body:JSON.stringify(body)});
    if(!r.ok) throw {code:"unavailable", message:`HTTP ${r.status}`};
    const t = await r.text(); return t ? JSON.parse(t) : null;
  }
  const k = path => `${fam}/${path}`;
  const watchers = [];
  const db = fam ? {
    doc(path){
      return {
        set: data => rpc("fq_set", {k:k(path), d:data}),
        onSnapshot(cb, err){
          let last = null, stop = false;
          const pull = async ()=>{
            const d = await rpc("fq_get", {k:k(path)});
            const s = JSON.stringify(d);
            if(s !== last){
              last = s;
              // Premiebilder hentes før premielisten vises, så feiringen kan vise bildet.
              const ids = (d && Array.isArray(d.list) ? d.list : []).map(p=>p && p.img).filter(id=>id && !cache[id]);
              await Promise.all(ids.map(id=>loadImg(id)));
              cb({exists: d!==null, data: ()=>d});
            }
          };
          const tick = async ()=>{
            if(stop) return;
            try{ await pull(); }catch(e){}
            setTimeout(tick, document.hidden ? 20000 : 3000);
          };
          watchers.push(pull);
          tick();
          return ()=>{ stop = true; };
        },
      };
    },
  } : null;
  // Bilder lagres som egne dokumenter, så premielisten holder seg liten.
  const cache = {}, loading = {};
  const loadImg = id => loading[id] || (loading[id] = rpc("fq_get", {k:k("img/"+id)}).then(d=>{ if(d && d.src) cache[id] = d.src; return cache[id]; }).catch(()=>{ delete loading[id]; }));
  const blobToDataURL = b => new Promise(r=>{ const fr = new FileReader(); fr.onload = ()=>r(fr.result); fr.readAsDataURL(b); });
  const assets = fam ? {
    async upload(blob){
      const id = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      const src = await blobToDataURL(blob);
      await rpc("fq_set", {k:k("img/"+id), d:{src}});
      cache[id] = src;
      return {id, url:src};
    },
    async delete(id){ await rpc("fq_set", {k:k("img/"+id), d:null}); delete cache[id]; return {deleted:true}; },
  } : null;

  window.FQ = {
    family: fam,
    // Hent nyeste poeng med en gang, før foreldre godkjenner, så ingen poeng overskrives.
    fresh: () => Promise.all(watchers.map(w=>w().catch(()=>{}))),
    imgSrc(id, onLoaded){
      if(cache[id]) return cache[id];
      if(fam && !loading[id]) loadImg(id).then(src=>{ if(src && onLoaded) onLoaded(); });
      return "";
    },
  };
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) FQ.fresh(); });
  window.claude = {use: async name => name==="db" ? db : name==="assets" ? assets : null};
})();
</script>

const ONES = ["null","en","to","tre","fire","fem","seks","sju","åtte","ni","ti","elleve","tolv","tretten","fjorten","femten","seksten","sytten","atten","nitten"];
const TENS = ["","","tjue","tretti","førti","femti","seksti","sytti","åtti","nitti"];
function numWord(n){
  if(n<20) return ONES[n];
  if(n===100) return "hundre";
  const t=Math.floor(n/10), o=n%10;
  return TENS[t] + (o ? ONES[o] : "");
}
const cap = s => s[0].toUpperCase()+s.slice(1);
const rnd = (a,b) => a+Math.floor(Math.random()*(b-a+1));
function mathQuestion(){
  let a,b,n,sign,word;
  const kind = rnd(0,2);
  if(kind===0){ a=rnd(2,12); b=rnd(2,9); n=a+b; sign="+"; word="pluss"; }
  else if(kind===1){ a=rnd(6,20); b=rnd(1,a-1); n=a-b; sign="−"; word="minus"; }
  else { a=[2,5,10][rnd(0,2)]; b=rnd(1,10); if(Math.random()<.5)[a,b]=[b,a]; n=a*b; sign="·"; word="ganger"; }
  const near = shuffle([n+1,n-1,n+2,n-2,n+10,n-10].filter(x=>x>=0 && x<=100 && x!==n));
  return {q:`Hva er ${a} ${sign} ${b}?`, say:`Hva er ${a} ${word} ${b}?`, a:cap(numWord(n)), w:near.slice(0,3).map(x=>cap(numWord(x)))};
}

function decideClaim(id, ok){
  const c = (PROG.claims||[]).find(x=>x.id===id);
  if(!c || c.status!=='pending') return;
  PROG.claims = PROG.claims.map(x=>x.id===id?{...x,status: ok?'approved':'rejected'}:x);
  if(ok){ PROG.bonus = (PROG.bonus||0) + TASKS[c.kind].pts; PROG.best = Math.max(PROG.best, total(PROG)); }

}

let voice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/^nb/i.test(v.lang)) || vs.find(v=>/^no|^nn/i.test(v.lang)) || vs.find(v=>/norsk|norw|nora/i.test(v.name)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, onEnd){
  const fallbackMs = 900 + text.length*70;
  let done=false; const finish=()=>{ if(!done){done=true; onEnd&&onEnd();} };
  if(!('speechSynthesis' in window)){ setTimeout(finish, 400); return; }
  const busy = speechSynthesis.speaking || speechSynthesis.pending;
  if(busy) speechSynthesis.cancel();
  if(!voice) pickVoice(); // iPad laster stemmene sent
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'nb-NO'; if(voice) u.voice = voice; u.rate = .92; u.pitch = 1.05;
  u.onend = finish; u.onerror = finish;
  window.__utt = u; try{ speechSynthesis.resume(); }catch(e){}
  if(busy) setTimeout(()=>speechSynthesis.speak(u), 150); else speechSynthesis.speak(u);
  setTimeout(finish, fallbackMs + 1500); // noen nettlesere glemmer onend
}

function nextCardHTML(){
  const list = sortedPrizes();
  if(!list.length) return '';
  const np = list.find(p=>PROG.best < p.at);
  if(!np) return `<div class="nextcard done"><div class="ring">${TROPHY}</div><div><small>Premieveien</small><b>Alle premiene er vunnet!</b></div></div>`;
  const prevAt = [...list].reverse().find(p=>p.at<=PROG.best)?.at || 0;
  const pct = Math.max(0, Math.min(1, (PROG.best-prevAt)/(np.at-prevAt)));
  const C = 2*Math.PI*44;
  return `<div class="nextcard">
    <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" class="ring-bg"/><circle cx="50" cy="50" r="44" class="ring-fg" style="stroke-dasharray:${C};stroke-dashoffset:${C*(1-pct)}"/></svg>${imgSrc(np)?`<img class="ringimg" src="${imgSrc(np)}" alt="">`:''}<span class="${imgSrc(np)?'pct-badge':''}">${Math.round(pct*100)}%</span></div>
    <div class="nc-text"><small>Neste premie</small><b>${esc(np.text)}</b><em>${np.at-PROG.best} poeng igjen</em></div>
  </div>`;
}

function ladderHTML(compact){
  let list = sortedPrizes();
  if(!list.length) return compact ? '' : '<p class="note">Ingen premier ennå. Pappa kan legge inn premier i foreldresonen.</p>';
  if(compact){
    // Forsiden: vunne premier som ikke er mottatt, pluss de tre neste.
    const open = list.filter(p=>!p.given && PROG.best>=p.at), next = list.filter(p=>PROG.best<p.at).slice(0,3);
    list = [...open, ...next];
    if(!list.length) return '';
  }
  const best = PROG.best;
  const items = [...list.filter(p=>p.at<=best), {me:true, at:best}, ...list.filter(p=>p.at>best)];
  const rows = items.map((it,i)=>{
    const top = i>0 && it.at<=best, bot = i<items.length-1 && items[i+1].at<=best;
    const cls = `${top?'gt':''} ${bot?'gb':''} ${i===0?'first':''} ${i===items.length-1?'last':''}`;
    if(it.me) return `<div class="rung me ${cls}"><span class="node ball">${BALL}</span><div class="me-body"><b>Du er her</b><small>${best} poeng</small></div></div>`;
    const st = it.given ? 'given' : best>=it.at ? 'open' : 'locked';
    const label = st==='given' ? 'Mottatt' : st==='open' ? 'Vunnet! Vis til pappa' : `${it.at-best} poeng igjen`;
    return `<div class="rung ${st} ${cls}"><span class="node">${st==='locked'?LOCK:TROPHY}</span><div class="rung-body"><span class="pts-badge">${it.at}</span>${imgTag(it,'rimg')}<b>${esc(it.text)}</b><small>${label}</small></div></div>`;
  }).join('');
  return `<div class="ladder">${compact?'<h3>Premieveien</h3>':''}${nextCardHTML()}<div class="track">${rows}</div></div>`;
}

/* ---------- Feiring: fanfare og fyrverkeri ---------- */
let actx = null;
function audioUnlock(){
  try{ if(!actx){ const AC = window.AudioContext||window.webkitAudioContext; if(AC) actx = new AC(); } if(actx && actx.state==='suspended') actx.resume(); }catch(e){}
}
document.addEventListener('pointerdown', audioUnlock, {passive:true});
document.addEventListener('keydown', audioUnlock);
try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
function iosUnlock(){
  audioUnlock();
  if(actx){ try{ const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start(0); }catch(e){} }
}
['touchend','click'].forEach(ev=>document.addEventListener(ev, iosUnlock, {capture:true, passive:true}));
function fanfare(){
  audioUnlock();
  if(!actx) return;
  const t0 = actx.currentTime + .05;
  const out = actx.createGain(); out.gain.value = .22;
  const lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 2600;
  lp.connect(out); out.connect(actx.destination);
  // Ta-ta-ta-taaa, ta-ta-TAAA: G C E G, E G (C-dur-akkord til slutt)
  const N = {G4:392, C5:523.25, E5:659.25, G5:783.99, C6:1046.5};
  const seq = [[N.G4,0,.14],[N.C5,.16,.14],[N.E5,.32,.14],[N.G5,.48,.42],[N.E5,.95,.16],[N.G5,1.13,1.3],[N.C5,1.13,1.3],[N.E5,1.13,1.3],[N.C6,1.13,1.3]];
  seq.forEach(([f,at,dur])=>{
    ['sawtooth','square'].forEach((type,k)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f*(k?1.003:1);
      const s = t0+at;
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(k?.12:.25, s+.03);
      g.gain.setValueAtTime(k?.10:.2, s+dur*.7);
      g.gain.exponentialRampToValueAtTime(.001, s+dur);
      o.connect(g); g.connect(lp); o.start(s); o.stop(s+dur+.05);
    });
  });
}
function fireworks(canvas, ms){
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const resize = ()=>{ canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  resize();
  const COLORS = ['#ffd23f','#7fd3ff','#ff5d73','#a8f0a0','#ffffff','#ffb347'];
  const rockets = [], sparks = [];
  let last = performance.now(), end = last + ms, nextLaunch = 0, alive = true;
  function launch(){
    rockets.push({x: innerWidth*(.15+Math.random()*.7), y: innerHeight, vx:(Math.random()-.5)*1.5, vy: -(innerHeight/95 + Math.random()*3), c: COLORS[Math.floor(Math.random()*COLORS.length)]});
  }
  function burst(r){
    const n = 70;
    for(let i=0;i<n;i++){
      const a = Math.PI*2*i/n, sp = 2+Math.random()*4.5;
      sparks.push({x:r.x, y:r.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, c: Math.random()<.25 ? '#ffffff' : r.c});
    }
  }
  function frame(now){
    if(!alive) return;
    const dt = Math.min(2, (now-last)/16.7); last = now;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(0,0,innerWidth,innerHeight);
    ctx.globalCompositeOperation = 'lighter';
    if(now < end && now > nextLaunch){ launch(); if(Math.random()<.4) launch(); nextLaunch = now + 350 + Math.random()*450; }
    for(let i=rockets.length-1;i>=0;i--){
      const r = rockets[i]; r.x += r.vx*dt; r.y += r.vy*dt; r.vy += .12*dt;
      ctx.fillStyle = r.c; ctx.beginPath(); ctx.arc(r.x, r.y, 2.5, 0, Math.PI*2); ctx.fill();
      if(r.vy >= -1){ burst(r); rockets.splice(i,1); }
    }
    for(let i=sparks.length-1;i>=0;i--){
      const s = sparks[i]; s.x += s.vx*dt; s.y += s.vy*dt; s.vy += .06*dt; s.vx *= .985; s.vy *= .985; s.life -= .012*dt;
      if(s.life<=0){ sparks.splice(i,1); continue; }
      ctx.globalAlpha = s.life; ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, 2.2, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    }
    if(now < end || rockets.length || sparks.length) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return ()=>{ alive = false; };
}

      <p>Vis denne skjermen til pappa!</p>

/* ---------- Lydeffekter, laget i nettleseren (ingen lydfiler) ---------- */
function noiseBuf(sec){
  const b = actx.createBuffer(1, Math.floor(actx.sampleRate*sec), actx.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return b;
}
// Riktig svar: et raskt «power-up»-arpeggio med glitter, pluss et lite publikumsbrus.
function sfxRight(crowd){
  audioUnlock(); if(!actx) return;
  const t0 = actx.currentTime + .02;
  const out = actx.createGain(); out.gain.value = .5; out.connect(actx.destination);
  [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{
    const o = actx.createOscillator(), g = actx.createGain(); o.type = 'square'; o.frequency.value = f;
    const s = t0 + i*.06;
    g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.12,s+.01); g.gain.exponentialRampToValueAtTime(.001,s+(i===4?.5:.14));
    o.connect(g); g.connect(out); o.start(s); o.stop(s+.55);
  });
  [2093,2637,3136].forEach((f,i)=>{
    const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f;
    const s = t0 + .3 + i*.05;
    g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.08,s+.01); g.gain.exponentialRampToValueAtTime(.001,s+.35);
    o.connect(g); g.connect(out); o.start(s); o.stop(s+.4);
  });
  if(crowd){
    const n = actx.createBufferSource(); n.buffer = noiseBuf(2);
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .7;
    const g = actx.createGain();
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.35,t0+.35); g.gain.exponentialRampToValueAtTime(.001,t0+1.9);
    n.connect(bp); bp.connect(g); g.connect(out); n.start(t0); n.stop(t0+2);
  }
}
// Feil svar: en skikkelig prompelyd. Lav, ujevn tone som blafrer og synker, med litt luft i.
function sfxFart(){
  audioUnlock(); if(!actx) return;
  const t0 = actx.currentTime + .02, dur = .55 + Math.random()*.35;
  const out = actx.createGain(); out.gain.value = .9; out.connect(actx.destination);
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650; lp.Q.value = 6; lp.connect(out);
  const o = actx.createOscillator(); o.type = 'sawtooth';
  const base = 85 + Math.random()*30;
  const steps = 24, curve = new Float32Array(steps);
  for(let i=0;i<steps;i++) curve[i] = base*(1 - .45*i/steps)*(1 + (Math.random()-.5)*.35);
  o.frequency.setValueCurveAtTime(curve, t0, dur);
  // Blafring: amplituden hakker opp og ned
  const flap = actx.createOscillator(); flap.type = 'square'; flap.frequency.setValueAtTime(18+Math.random()*10, t0); flap.frequency.linearRampToValueAtTime(9, t0+dur);
  const flapG = actx.createGain(); flapG.gain.value = .5;
  const amp = actx.createGain(); amp.gain.value = .5;
  flap.connect(flapG); flapG.connect(amp.gain);
  const env = actx.createGain();
  env.gain.setValueAtTime(0,t0); env.gain.linearRampToValueAtTime(.7,t0+.03); env.gain.setValueAtTime(.6,t0+dur*.6); env.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(amp); amp.connect(env); env.connect(lp);
  const n = actx.createBufferSource(); n.buffer = noiseBuf(dur+.1);
  const nf = actx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 400;
  const ng = actx.createGain(); ng.gain.setValueAtTime(.25,t0); ng.gain.exponentialRampToValueAtTime(.001,t0+dur);
  n.connect(nf); nf.connect(ng); ng.connect(amp);
  o.start(t0); flap.start(t0); n.start(t0);
  o.stop(t0+dur+.05); flap.stop(t0+dur+.05); n.stop(t0+dur+.1);
}


/* ---------- Bilder av premiene ----------
   Pappa laster opp et bilde i foreldresonen. Bildet krympes i nettleseren og lagres i appens bildelager,
   og premien husker bare bilde-id-en. */
let assetsNs = null;
(async()=>{ try{ assetsNs = window.claude && window.claude.use ? await window.claude.use("assets") : null; }catch(e){ assetsNs = null; } })();
function shrinkImage(file, max){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = ()=>{
      const k = Math.min(1, max/Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b ? resolve(b) : reject(new Error('toBlob')), 'image/jpeg', .82);
    };
    im.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Bildet kunne ikke leses')); };
    im.src = url;
  });
}
const blobToDataURL = b => new Promise(r=>{ const fr = new FileReader(); fr.onload = ()=>r(fr.result); fr.readAsDataURL(b); });
async function uploadPrizeImage(file){
  if(assetsNs){
    const blob = await shrinkImage(file, 900);
    try{ return {img:(await assetsNs.upload(blob, {contentType:'image/jpeg'})).id}; }
    catch(e){
      if(e && e.code==='store_unavailable'){ await new Promise(r=>setTimeout(r, 800)); return {img:(await assetsNs.upload(blob, {contentType:'image/jpeg'})).id}; }
      throw e;
    }
  }
  // Uten bildelager (for eksempel en lokal kopi): lagre et lite bilde direkte i premien.
  return {imgData: await blobToDataURL(await shrinkImage(file, 320))};
}
function dropPrizeImage(p){ if(p && p.img && assetsNs) assetsNs.delete(p.img).catch(()=>{}); }
// På nettsiden hentes bildene fra databasen og vises når de er lastet.
function imgLoaded(){ refreshIdle(); }
const imgSrc = p => p && p.img ? FQ.imgSrc(p.img, imgLoaded) : (p && p.imgData) || "";
const imgTag = (p, cls) => imgSrc(p) ? `<img class="${cls}" src="${imgSrc(p)}" alt="${esc(p.text)}">` : '';
// Felles opplastingsknapp per premie i foreldresonen.
function wireImageButtons(rerender){
  app.querySelectorAll('[data-img]').forEach(inp=>inp.onchange = async ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const id = inp.dataset.img, lab = inp.closest('label'); if(lab) lab.firstChild.textContent = 'Laster opp …';
    try{
      const res = await uploadPrizeImage(f);
      const old = PRIZES.list.find(p=>p.id===id);
      PRIZES.list = PRIZES.list.map(p=>p.id===id ? {...p, img:undefined, imgData:undefined, ...res} : p);
      save("prizes"); dropPrizeImage(old);
    }catch(e){ const er = document.getElementById('imgErr'); if(er) er.textContent = 'Bildet ble ikke lastet opp. Prøv et annet bilde.'; if(lab) lab.firstChild.textContent = 'Prøv igjen'; return; }
    rerender();
  });
}

/* ---------- Kamp ---------- */
function newMatch(mode){
  S = {mode, qs: MODES[mode].make().slice(0, MATCH_LEN), i:0, home:0, away:0, bestBefore:PROG.best, delta:0};
  question();
}

function boardHTML(){
  const minute = Math.round((S.i)/MATCH_LEN*90);
  return `<div class="board" role="status" aria-label="Stilling">
    <div class="team home">Benjamin FC</div>
    <div class="score">${S.home}–${S.away}</div>

    <div class="meta"><span>${MODES[S.mode].name.toUpperCase()} · <b>${S.i+1}</b>/${MATCH_LEN}</span><span><b>${minute}'</b></span></div>
  </div>`;
}
function scoreWrong(){ S.away++; S.delta+=WRONG; changePts(S.mode, WRONG); app.querySelector('.board').outerHTML = boardHTML(); }
function scoreRight(){ S.home++; S.delta+=RIGHT_OF(); const q=S.cur.item.q; if(S.mode==='historie' && !(PROG.learned||[]).includes(q)) PROG.learned=[...(PROG.learned||[]), q]; changePts(S.mode, RIGHT_OF()); }

function question(){
  const my = ++token; screen = "match"; keyHandler = null;
  const item = S.qs[S.i];
  S.cur = {item, tries:0, opts: item.type ? [] : shuffle([item.a, ...item.w])};
  app.innerHTML = `${boardHTML()}
  <div class="pitch">
    <div class="qcard">
      <div class="qtext" id="qt">${esc(item.q)}</div>
      <button class="listen" id="listen" aria-label="Hør igjen">${SPEAKER}</button>
    </div>
    <div class="hint" id="hint">Hør godt etter …</div>
    <div id="area"></div>
  </div>
  <div id="after"></div>
  <div class="quitrow"><button class="quit" id="quit">Avslutt kampen</button></div>`;
  // Avslutt midt i kampen: to trykk, så det ikke skjer ved et uhell. Poeng han har fått, beholder han.
  const quit = document.getElementById('quit');
  quit.onclick = () => {
    if(quit.dataset.sure){
      token++; keyHandler = null;
      if('speechSynthesis' in window) speechSynthesis.cancel();
      S.quit = true;
      if(S.home + S.away > 0) endScreen(); else startScreen();
      return;
    }
    quit.dataset.sure = "1"; quit.textContent = "Trykk igjen for å avslutte"; quit.classList.add('sure');
    setTimeout(()=>{ if(quit.isConnected){ delete quit.dataset.sure; quit.textContent = "Avslutt kampen"; quit.classList.remove('sure'); } }, 3000);
  };
  const listen = document.getElementById('listen');
  const spoken = item.say || item.q;
  listen.onclick = () => { listen.classList.add('speaking'); speak(spoken, ()=>listen.classList.remove('speaking')); };
  listen.classList.add('speaking');
  if(item.type){
    typingArea(my);
    speak(spoken, ()=>listen.classList.remove('speaking'));
  } else {
    document.getElementById('area').innerHTML = '<div class="answers" id="answers"></div>';
    renderAnswers(true);
    speak(spoken, ()=>{ listen.classList.remove('speaking'); if(my===token) reveal(my); });
  }
}

/* ----- Flervalg ----- */
function renderAnswers(hidden){
  const box = document.getElementById('answers');
  box.innerHTML = S.cur.opts.map((o,k)=>{
    const isWrong = S.cur.wrongPicked===o;
    return `<button class="ans ${hidden?'hidden-text':''} ${isWrong?'wrong':''}" data-o="${esc(o)}" ${hidden||isWrong?'disabled':''} id="ans${k}"><span class="reading">${esc(o)}</span><span class="bar"></span></button>`;
  }).join('');
  box.querySelectorAll('.ans').forEach(b=>b.onclick=()=>pick(b));
}
// Viser svarene, men låser dem til lesestolpen er full.
function reveal(my){
  if(my!==token || S.cur.revealed) return;
  S.cur.revealed = true;
  lockAndRead(my, 'Les svarene!');
}
function lockAndRead(my, text){
  renderAnswers(false);
  const hint = document.getElementById('hint');
  hint.textContent = text;
  const btns = [...document.querySelectorAll('.ans:not(.wrong)')];
  const ms = readMs(S.cur.opts);
  btns.forEach(b=>{ b.disabled=true; b.classList.add('locked'); const bar=b.querySelector('.bar'); bar.style.transition=`width ${ms}ms linear`; requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width='100%')); });
  setTimeout(()=>{
    if(my!==token) return;
    btns.forEach(b=>{ b.disabled=false; b.classList.remove('locked'); b.querySelector('.bar').style.opacity=0; });
    hint.textContent = 'Trykk på riktig svar';
  }, ms);
}
async function pick(btn){
  const my = token;
  const o = btn.dataset.o, item = S.cur.item;
  document.querySelectorAll('.ans').forEach(b=>b.disabled=true);
  S.cur.tries++;
  if(o===item.a){
    btn.classList.add('right');
    if(S.cur.tries===1){ scoreRight(); sfxRight(true); await showFlash(`<div><div class="msg">MÅÅÅL!</div>${ptsTag(RIGHT_OF())}</div>`, 1400); }
    else { sfxRight(false); await showFlash('<div><div class="msg mid">Riktig!</div><div class="sub">Men ingen mål denne gangen</div></div>', 1400); }
    finishChoice(my, true);
  } else {
    btn.classList.add('wrong');
    scoreWrong(); sfxFart();
    if(S.cur.tries===1){
      S.cur.wrongPicked = o;
      await showFlash(`<div class="col"><div class="card y"></div><div class="sub">Gult kort! Gjettelaget scoret.</div>${ptsTag(WRONG)}</div>`, 1800);
      if(my!==token) return;
      // Bytt plass på svarene så han må lese igjen, ikke bare trykke på knappen ved siden av.
      S.cur.opts = shuffle(S.cur.opts);
      lockAndRead(my, 'Prøv igjen. Les nøye!');
    } else {
      await showFlash(`<div class="col"><div class="card r"></div><div class="sub">Rødt kort! Gjettelaget scoret igjen.</div>${ptsTag(WRONG)}</div>`, 1800);
      finishChoice(my, false);
    }
  }
}
// Viser og leser opp riktig svar til slutt, så han hører ordet han nettopp har sett.
function finishChoice(my, won){
  if(my!==token) return;
  const item = S.cur.item;
  app.querySelector('.board').outerHTML = boardHTML();
  const right = [...document.querySelectorAll('.ans')].find(b=>b.dataset.o===item.a);
  document.querySelectorAll('.ans').forEach(b=>{ b.disabled=true; if(b!==right && !b.classList.contains('wrong')) b.style.opacity=.35; });
  right.classList.add('right','say');
  document.getElementById('hint').textContent = won ? 'Bra lest!' : 'Det riktige svaret var:';
  if(item.f) document.getElementById('area').insertAdjacentHTML('beforeend', `<div class="fact">${esc(item.f)}</div>`);
  speak(item.f ? `${item.a}. ${item.f}` : item.a, ()=>right.classList.remove('say'));
  nextButton();
}
function nextButton(){
  const last = S.i === MATCH_LEN-1;
  document.getElementById('after').innerHTML = `<div style="display:flex;justify-content:center"><button class="next" id="nx">${last?'Se resultatet':'Neste spørsmål'}</button></div>`;
  const nx = document.getElementById('nx');
  nx.onclick = ()=>{ if(last) endScreen(); else { S.i++; question(); } };
  keyHandler = k => { if(k==="Enter") nx.click(); };
}

/* ----- Skriving (norsk) ----- */
// Eget tastatur på skjermen, så nettbrettets autokorrektur og ordforslag ikke kan skrive ordet for ham.
const ROWS = ["qwertyuiopå","asdfghjkløæ","zxcvbnm"];
let keyHandler = null;
document.addEventListener('keydown', e=>{
  if(!keyHandler || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
  if(/^[a-zæøå]$/.test(k) || k==="Backspace" || k==="Enter"){ e.preventDefault(); keyHandler(k); }
});
function typingArea(my){
  S.cur.typed = ""; S.cur.copy = false;
  document.getElementById('area').innerHTML = `
    <div class="typed" id="typed" aria-live="polite"></div>
    <div class="attempts" id="attempts"></div>
    <div class="kb" id="kb">
      ${ROWS.map((r,i)=>`<div class="kb-row">${[...r].map(c=>`<button class="key" data-k="${c}">${c}</button>`).join('')}${i===2?'<button class="key wide" data-k="Backspace" aria-label="Slett">⌫</button>':''}</div>`).join('')}
      <div class="kb-row"><button class="key check" data-k="Enter">Sjekk</button></div>
    </div>`;
  document.getElementById('hint').textContent = 'Skriv ordet du hørte';
  document.getElementById('kb').querySelectorAll('.key').forEach(b=>b.onclick=()=>keyHandler && keyHandler(b.dataset.k));
  keyHandler = k => typeKey(my, k);
  drawTyped();
}
function drawTyped(){
  const el = document.getElementById('typed');
  el.innerHTML = S.cur.typed ? esc(S.cur.typed) : '<span class="ph">…</span>';
}
function typeKey(my, k){
  if(my!==token) return;
  if(k==="Backspace") S.cur.typed = S.cur.typed.slice(0,-1);
  else if(k==="Enter") return checkTyped(my);
  else if(S.cur.typed.length < 16) S.cur.typed += k;
  drawTyped();
}
async function checkTyped(my){
  const item = S.cur.item, guess = S.cur.typed.trim().toLowerCase(), ok = guess===item.a.toLowerCase();
  if(!guess) return;
  const typedEl = document.getElementById('typed');
  if(S.cur.copy){
    // Etter rødt kort skriver han av det riktige ordet før han går videre. Gir ingen poeng.
    if(ok){ keyHandler=null; typedEl.classList.add('ok'); speak(item.a); document.getElementById('hint').textContent='Bra! Nå husker du det.'; nextButton(); }
    else { typedEl.classList.remove('shake'); void typedEl.offsetWidth; typedEl.classList.add('shake'); }
    return;
  }
  keyHandler = null;
  S.cur.tries++;
  if(ok){
    typedEl.classList.add('ok');
    if(S.cur.tries===1){ scoreRight(); sfxRight(true); await showFlash(`<div><div class="msg">MÅÅÅL!</div>${ptsTag(RIGHT_OF())}</div>`, 1400); }
    else { sfxRight(false); await showFlash('<div><div class="msg mid">Riktig!</div><div class="sub">Men ingen mål denne gangen</div></div>', 1400); }
    if(my!==token) return;
    app.querySelector('.board').outerHTML = boardHTML();
    document.getElementById('hint').textContent = 'Riktig skrevet!';
    speak(item.a);
    nextButton();
    return;
  }
  scoreWrong(); sfxFart();
  document.getElementById('attempts').innerHTML += `<s>${esc(guess)}</s>`;
  if(S.cur.tries===1){
    await showFlash(`<div class="col"><div class="card y"></div><div class="sub">Gult kort! Gjettelaget scoret.</div>${ptsTag(WRONG)}</div>`, 1800);
    if(my!==token) return;
    S.cur.typed = ""; drawTyped();
    document.getElementById('hint').textContent = 'Nesten! Hør en gang til og prøv igjen.';
    keyHandler = k => typeKey(my, k);
    speak(item.say);
  } else {
    await showFlash(`<div class="col"><div class="card r"></div><div class="sub">Rødt kort! Gjettelaget scoret igjen.</div>${ptsTag(WRONG)}</div>`, 1800);
    if(my!==token) return;
    S.cur.copy = true; S.cur.typed = ""; drawTyped();
    document.getElementById('hint').innerHTML = `Slik skrives det: <span class="answer-word">${esc(item.a.toLowerCase())}</span><br>Skriv det av.`;
    speak(item.a);
    keyHandler = k => typeKey(my, k);
  }
}

/* ---------- Slutt på kampen ---------- */
function endScreen(){
  token++; screen = "end"; keyHandler = null;
  PROG.matches++; save("prog");
  const won = S.home>S.away, draw = S.home===S.away;
  const title = won ? 'Du vant kampen!' : draw ? 'Uavgjort!' : 'Gjettelaget vant';
  const line = won ? 'Du leste godt. Det er sånn mesterne gjør det.' : draw ? 'Jevn kamp. Klarer du å vinne neste?' : 'Les alle svarene før du trykker, så slår du dem neste gang.';
  const unlocked = sortedPrizes().filter(p=>S.bestBefore < p.at && PROG.best >= p.at);
  const lvlUp = levelOf(PROG.best) > levelOf(S.bestBefore);
  app.innerHTML = `
  <div class="screen">
    <h1>${title}</h1>
    <div class="board" style="width:100%;max-width:440px"><div class="team home">Benjamin FC</div><div class="score">${S.home}–${S.away}</div><div class="team away">Gjettelaget</div><div class="meta"><span>${S.quit?'AVBRUTT':'FULLTID'}</span><span><b>${S.quit?'':"90'"}</b></span></div></div>
    <p class="delta ${S.delta>=0?'plus':'minus'}">${S.delta>=0?'+':'−'}${Math.abs(S.delta)} poeng i denne kampen</p>
    ${lvlUp ? `<p class="unlock">Nytt nivå: <b>${LEVELS[levelOf(PROG.best)][1]}</b></p>` : ''}
    ${unlocked.map(p=>`<p class="unlock">Premie låst opp: <b>${esc(p.text)}</b></p>`).join('')}
    <p style="font-size:22px;max-width:440px;margin:0">${line}</p>
    <div class="modes">
      <button class="mode" id="again" style="--c:${MODES[S.mode].color}">Ny kamp i ${MODES[S.mode].name.toLowerCase()}</button>
      <button class="mode" id="menu" style="--c:#f4f7ef">Til start</button>
    </div>
  </div>`;
  if(unlocked.length) checkCelebrate();
  else if(won) showFlash('<div class="msg">SEIER!</div>', 1500);
  if(!unlocked.length) speak(title);
  const mode = S.mode;
  document.getElementById('again').onclick = ()=>newMatch(mode);
  document.getElementById('menu').onclick = startScreen;
}

startScreen();
</script>
