<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blokkøya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Fullskjerms spill: lerret bak, HUD som flytende "leketøy"-knapper. Én bevisst lys stil. */
:root{
  --ink:#1E2A4A; --ink-soft:#4A5878; --paper:#FFFFFF; --sun:#FFC83D; --sun-deep:#F59E0B;
  --good:#2BB673; --sky:#9FD3FF; --glass:rgba(255,255,255,.86);
  --font:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
button{font-family:var(--font);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--sun-deep);outline-offset:2px}

.hud{position:fixed;z-index:5;pointer-events:none}
.hud *{pointer-events:auto}
#top{top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pill{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;
  box-shadow:0 4px 0 rgba(30,42,74,.18),0 10px 24px rgba(30,42,74,.14);padding:8px 16px;font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
#stars .n{font-variant-numeric:tabular-nums;min-width:1.6em}
#gems .of{font-size:15px;color:var(--ink-soft);margin-left:-4px}
.lft{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}.lft .row{display:flex;gap:8px}
.goal{border:0;font-size:17px;font-weight:600;padding:8px 14px;max-width:min(330px,calc(100vw - 150px));text-align:left;line-height:1.2;cursor:pointer}.goal .spk{font-size:15px;opacity:.7}
.goal.pop{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
#gems.bump,#stars.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.btns{display:flex;gap:8px}
.ib{width:52px;height:52px;border:0;border-radius:50%;background:var(--glass);font-size:24px;
  box-shadow:0 4px 0 rgba(30,42,74,.18),0 10px 24px rgba(30,42,74,.14);display:grid;place-items:center;transition:transform .12s}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(30,42,74,.18)}
.ib.off{opacity:.45}

#quiz{top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%) translateY(-12px) scale(.96);opacity:0;
  width:min(460px,calc(100% - 270px));transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
#quiz.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
#quiz.show *{pointer-events:auto}
.qcard{background:var(--paper);border-radius:22px;padding:10px 16px;box-shadow:0 6px 0 rgba(30,42,74,.16),0 18px 40px rgba(30,42,74,.18);
  display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.qlabel{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.qword{font-size:clamp(30px,7vw,52px);font-weight:700;letter-spacing:.14em;line-height:1;padding-left:.14em;display:flex}
.qword span{display:inline-block;transition:color .15s,transform .2s}
.qword span.hi{color:var(--sun-deep);transform:translateY(-6px) scale(1.15)}
.qtext{font-size:clamp(17px,3.8vw,21px);font-weight:600;line-height:1.25;text-wrap:balance}
.qrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.say{border:0;background:#EEF4FF;border-radius:999px;padding:6px 14px;font-size:17px;font-weight:600;box-shadow:0 3px 0 #C9D6F2}
.say:active{transform:translateY(2px);box-shadow:none}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:#E3E8F2;display:block;transition:background .3s,transform .3s}
.dots i.on{background:var(--good);transform:scale(1.15)}

#toast{top:38%;left:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;font-size:clamp(40px,10vw,76px);font-weight:700;
  color:#fff;text-shadow:0 4px 0 rgba(30,42,74,.35),0 10px 30px rgba(30,42,74,.35);white-space:nowrap;text-align:center}
#toast small{display:block;font-size:.42em;font-weight:600;margin-top:4px}
#toast.go{animation:toast 1.8s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}

#help{bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);font-size:16px;font-weight:600;transition:opacity .6s;white-space:nowrap}
#joy,#jump{pointer-events:auto}
#joy{left:max(24px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.7);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(30,42,74,.25);pointer-events:none}
#jump{right:max(28px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 36px);width:104px;height:104px;border-radius:50%;border:0;
  background:var(--sun);font-size:20px;font-weight:700;box-shadow:0 6px 0 var(--sun-deep),0 14px 30px rgba(30,42,74,.25);touch-action:none}
#jump:active,#jump.down{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-deep)}

#fade{position:fixed;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#fade.on{opacity:1}

#start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(90,169,245,.15),rgba(30,42,74,.35))}
.panel{background:var(--paper);border-radius:32px;padding:26px 26px 24px;width:min(520px,100%);box-shadow:0 8px 0 rgba(30,42,74,.18),0 30px 80px rgba(30,42,74,.35);text-align:center;
  animation:rise .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.95)}}
.logo{font-size:clamp(44px,12vw,64px);font-weight:700;line-height:1;letter-spacing:.01em;margin:0}
.logo b{display:inline-block;padding:0 .08em;border-radius:.18em;color:#fff;margin:0 .02em;transform:rotate(var(--r));box-shadow:0 .08em 0 rgba(0,0,0,.18)}
.sub{font-size:19px;color:var(--ink-soft);margin:12px 0 18px;font-weight:500}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.kid{border:3px solid #E3E8F2;background:#F7F9FD;border-radius:22px;padding:14px 8px 12px;font-size:21px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s,border-color .15s}
.kid .av{width:54px;height:64px;position:relative}
.kid .av:before{content:"";position:absolute;left:12px;top:0;width:30px;height:28px;border-radius:6px;background:#F2C9A0;box-shadow:inset 0 7px 0 #6B4226}
.kid .av:after{content:"";position:absolute;left:6px;top:30px;width:42px;height:34px;border-radius:7px;background:var(--shirt)}
.kid[aria-pressed="true"]{border-color:var(--ink);background:#fff;transform:translateY(-3px)}
.go{border:0;width:100%;background:var(--good);color:#fff;font-size:26px;font-weight:700;border-radius:20px;padding:14px;box-shadow:0 6px 0 #1E8A55;transition:transform .1s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #1E8A55}
.how{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:15px;color:var(--ink-soft);font-weight:500}
@media (max-width:560px){#quiz{top:calc(env(safe-area-inset-top,0px) + 72px);width:calc(100% - 24px)}}
@media (max-height:520px){#quiz{top:calc(env(safe-area-inset-top,0px) + 10px);width:min(460px,calc(100% - 270px))}.qcard{flex-direction:row;justify-content:center;gap:14px;padding:6px 14px}.qlabel{display:none}.qword{font-size:34px}.qtext{font-size:16px}.qrow{flex-wrap:nowrap;gap:8px}.dots{display:none}}

.lvl{border:0;font-size:16px;padding:6px 12px 6px 8px;gap:8px;cursor:pointer}
.lvl .lb{display:grid;place-items:center;min-width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#A78BFA,#6D5BEF);color:#fff;font-size:18px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.lvl .bx{display:flex;flex-direction:column;gap:3px;align-items:flex-start;line-height:1}
.lvl .bx small{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.04em}
.bar{display:block;width:64px;height:9px;border-radius:9px;background:#E3E8F2;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#8B5CF6,#4F8DF7);transition:width .5s}
.lvl.lvup{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
#shopBtn{position:relative}#shopBtn.new:after{content:"";position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:#FF4D6D;border:2px solid #fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.3)}}
#shop{position:fixed;z-index:7;top:0;right:0;bottom:0;width:min(430px,100%);padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) 12px;box-sizing:border-box;display:flex;pointer-events:none}
.spanel{pointer-events:auto;flex:1;background:var(--paper);border-radius:28px;box-shadow:0 8px 0 rgba(30,42,74,.16),0 24px 60px rgba(30,42,74,.3);display:flex;flex-direction:column;overflow:hidden;animation:slidein .35s cubic-bezier(.3,1.3,.5,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.shead{display:flex;align-items:center;gap:10px;padding:14px 14px 6px 20px}.stitle{font-size:26px;font-weight:700;flex:1}
.sstars{font-size:19px;padding:6px 12px;box-shadow:none;background:#FFF6D6}
.sclose{width:46px;height:46px;font-size:20px;box-shadow:0 3px 0 rgba(30,42,74,.14);background:#F1F4FA}
.slvl{display:flex;align-items:center;gap:8px;padding:0 20px 10px;font-weight:700;font-size:16px}.slvl .tt{color:var(--ink-soft);font-weight:600;flex:1}.slvl .bar{width:90px}
.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
.tab{border:0;flex:1;min-width:64px;background:#F1F4FA;border-radius:16px;padding:7px 4px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}.tab span{font-size:24px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;padding:4px 14px 16px;align-content:start;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.item{border:3px solid #E3E8F2;background:#F9FAFD;border-radius:20px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600}
.item .ic{font-size:40px;line-height:1.1}.item .nm{font-size:15px;line-height:1.15;text-align:center;min-height:2.3em;display:flex;align-items:center}
.item .st{font-size:14px;font-weight:700;border-radius:999px;padding:3px 10px;background:#EEF1F7;color:var(--ink-soft)}
.item.on{border-color:var(--good);background:#EFFBF4}.item.on .st{background:var(--good);color:#fff}
.item.owned .st{background:#E6EEFF;color:#2F5FD0}
.item.buy .st,.item.confirm .st{background:var(--sun);color:var(--ink)}.item.confirm{border-color:var(--sun-deep);background:#FFF8E1;animation:bump .4s}
.item.poor .st{background:#FFF1F1;color:#C0392B}.item.locked,.item.chest{opacity:.6}.item.locked .ic,.item.chest .ic{filter:grayscale(.85)}
.item.nope{animation:nope .35s}@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:699px){#shop{top:auto;width:100%;height:62%}.spanel{animation-name:slideup}}
@keyframes slideup{from{transform:translateY(40px);opacity:0}}
.qword .blank{color:var(--sun-deep)}.qword.sent{font-size:clamp(20px,4.4vw,30px);letter-spacing:.03em;flex-wrap:wrap;justify-content:center;gap:0 .35em;padding-left:0}.qword.math{letter-spacing:.04em}
.ib.back{width:auto;border-radius:26px;padding:0 18px;font-size:18px;font-weight:700;display:flex;gap:6px;align-items:center}
.sback{border:0;background:#F1F4FA;border-radius:16px;margin-top:12px;padding:10px 18px;font-size:18px;font-weight:600;color:var(--ink)}
.fly{position:fixed;left:0;top:0;z-index:6;font-size:34px;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(30,42,74,.35));will-change:transform}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<canvas id="c" touch-action="none"></canvas>

<div id="top" class="hud">
  <div class="lft"><div class="row"><div id="stars" class="pill" aria-live="polite"><span aria-hidden="true">⭐</span><span class="n">0</span></div>
    <div id="gems" class="pill" aria-label="Krystaller"><span aria-hidden="true">💎</span><span class="n">0</span><span class="of">/5</span></div>
    <button id="lvl" class="pill lvl" aria-label="Nivå"><span class="lb"><b>1</b></span><span class="bx"><small>NIVÅ</small><span class="bar"><i></i></span></span></button></div>
    <button id="goal" class="pill goal" hidden><span aria-hidden="true">🎯</span><span class="t"></span><span aria-hidden="true" class="spk">🔊</span></button></div>
  <div class="btns">
    <button id="shopBtn" class="ib" aria-label="Garderobe">👕</button>
    <button id="backBtn" class="ib back" aria-label="Tilbake til appen" hidden><span aria-hidden="true">←</span> Tilbake</button>
    <button id="musicBtn" class="ib" aria-label="Musikk av/på">🎵</button>
  </div>
</div>

<div id="quiz" class="hud" aria-live="polite">
  <div class="qcard">
    <div class="qlabel" id="qlabel">Les ordet</div>
    <div class="qword" id="qword"></div>
    <div class="qtext" id="qtext" hidden></div>
    <div class="qrow">
      <button class="say" id="sayBtn">🔊 Hør ordet</button>
      <div class="dots" id="dots"><i></i><i></i><i></i></div>
    </div>
  </div>
</div>

<div id="toast" class="hud"></div>
<div id="help" class="hud pill">⬆️⬇️⬅️➡️ / WASD gå · Mellomrom hopp · Dra for å snu</div>
<div id="joy" class="hud" hidden><div id="knob"></div></div>
<button id="jump" class="hud" hidden aria-label="Hopp">HOPP</button>
<div id="shop" hidden><div class="spanel" role="dialog" aria-label="Garderobe">
  <div class="shead"><div class="stitle">Garderobe</div><div class="pill sstars"><span aria-hidden="true">⭐</span><span class="n">0</span></div><button class="ib sclose" aria-label="Lukk">✕</button></div>
  <div class="slvl"><span class="lv">Nivå 1</span><span class="tt"></span><span class="bar"><i></i></span></div>
  <div class="tabs" role="tablist"></div><div class="grid"></div></div></div>
<div id="fade"></div>

<div id="start">
  <div class="panel">
    <h1 class="logo"><b style="background:#FF6B6B;--r:-6deg">B</b><b style="background:#FFC83D;--r:4deg">L</b><b style="background:#2BB673;--r:-3deg">O</b><b style="background:#4F8DF7;--r:5deg">K</b><b style="background:#A66BFF;--r:-5deg">K</b><span style="display:inline-block;margin-left:.12em">øya</span></h1>
    <p class="sub">Hopp over blokkene, samle stjerner og vinn skatter!</p>
    <div class="kids">
      <button class="kid" data-kid="benjamin" style="--shirt:#2F80ED" aria-pressed="true"><span class="av"></span>Benjamin</button>
      <button class="kid" data-kid="bastian" style="--shirt:#FF8A3D" aria-pressed="false"><span class="av"></span>Bastian</button>
    </div>
    <button class="go" id="goBtn">Spill!</button>
    <button class="sback" id="startBack" hidden>← Tilbake til appen</button>
    <div class="how"><span>🏝️ 5 verdener</span><span>👕 Utstyr</span><span>🏅 Nivåer</span></div>
  </div>
</div>

<script>
// Tilbake til appen kobles til før alt annet, så knappen virker selv om 3D-motoren ikke laster.
(function(){var q=new URLSearchParams(location.search),kid=q.get('kid');if(!(kid==='benjamin'||kid==='bastian'||q.get('embed')==='1'))return;
  function back(){try{speechSynthesis.cancel()}catch(e){}try{if(window.__blokkAC)window.__blokkAC.suspend()}catch(e){}
    try{if(window.parent!==window){window.parent.postMessage({type:'blokkoya-close'},location.origin);return}}catch(e){}location.href=(kid==='bastian'?'bastian':'benjamin')+'.html'}
  ['backBtn','startBack'].forEach(function(id){var b=document.getElementById(id);b.hidden=false;b.addEventListener('click',back)});
  addEventListener('keydown',function(e){if(e.code==='Escape'&&document.getElementById('shop').hidden)back()});
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.31.0/babylon.js"></script>
<script>
(async function(){
"use strict";
const $=s=>document.querySelector(s);
const V3=(x,y,z)=>new BABYLON.Vector3(x,y,z);
const C=h=>BABYLON.Color3.FromHexString(h);
const C4=(h,a=1)=>{const c=C(h);return new BABYLON.Color4(c.r,c.g,c.b,a)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
let seed=7;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rr=(a,b)=>a+rnd()*(b-a);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const easeBack=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const easeOut=k=>1-Math.pow(1-k,3);
const FONT='"Fredoka","Trebuchet MS","Segoe UI",sans-serif';
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

// ---------- lagring ----------
// I appene: ?kid=benjamin|bastian&embed=1. Riktige svar gir da poeng/stjerner i appen.
const QS=new URLSearchParams(location.search);
const KID=['benjamin','bastian'].includes(QS.get('kid'))?QS.get('kid'):null;
const EMBED=QS.get('embed')==='1';
const SAVE_KEY='blokkoya-v1'+(KID?'-'+KID:'');
let save={stars:0,hats:[],hat:'',kid:'benjamin',music:true};let shopOpen=false;
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'))}catch(e){}
if(KID)save.kid=KID;
// Poeng til appen: legges i localStorage, appen henter dem (samme nettsted) og nullstiller.
function appCredit(mode,n){if(!KID||n<=0)return 0;const key='blokkoya-credit-'+KID;let c={};try{c=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}
  const m=KID==='bastian'?'stars':mode;c[m]=(c[m]||0)+n;try{localStorage.setItem(key,JSON.stringify(c))}catch(e){return 0}
  try{if(window.parent!==window)window.parent.postMessage({type:'blokkoya-credit'},location.origin)}catch(e){}return n}
function goBack(){try{if(window.parent!==window){window.parent.postMessage({type:'blokkoya-close'},location.origin);return}}catch(e){}location.href=(KID||'benjamin')+'.html'}
const persist=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}};

try{await Promise.race([document.fonts.load('700 80px Fredoka'),new Promise(r=>setTimeout(r,1500))])}catch(e){}

// ---------- motor og scene ----------
const canvas=$('#c');
const COARSE=matchMedia('(pointer:coarse)').matches;
const engine=new BABYLON.Engine(canvas,true,{stencil:true,antialias:true},true);
engine.setHardwareScalingLevel(1/Math.min(window.devicePixelRatio||1,matchMedia('(pointer:coarse)').matches?1.5:2));
const scene=new BABYLON.Scene(engine);
scene.clearColor=C4('#DDF0FF');

const mats={};
function mat(hex,o={}){
  const k=hex+JSON.stringify(o);if(mats[k])return mats[k];
  const m=new BABYLON.StandardMaterial('m'+k,scene);
  m.diffuseColor=C(hex);m.specularColor=new BABYLON.Color3(.06,.06,.06);m.specularPower=24;
  if(o.em)m.emissiveColor=C(o.em);
  if(o.spec){m.specularColor=new BABYLON.Color3(o.spec,o.spec,o.spec);m.specularPower=o.pow||64}
  if(o.alpha!=null)m.alpha=o.alpha;
  return mats[k]=m;
}

// ---------- teksturer ----------
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function dynTex(w,h,mips=true){const t=new BABYLON.DynamicTexture('dt',{width:w,height:h},scene,mips);t.hasAlpha=true;t.wrapU=t.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;return t}
function unlit(tex){const m=new BABYLON.StandardMaterial('um',scene);m.diffuseTexture=tex;m.emissiveTexture=tex;m.useAlphaFromDiffuseTexture=true;m.disableLighting=true;m.fogEnabled=true;return m}
const DOT=(()=>{const t=dynTex(64,64,false),c=t.getContext();const g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,64,64);t.update();return t})();
const SQ=(()=>{const t=dynTex(32,32,false),c=t.getContext();c.fillStyle='#fff';rrect(c,4,8,24,16,4);c.fill();t.update();return t})();
const STAR_T=(()=>{const t=dynTex(64,64,false),c=t.getContext();c.fillStyle='#fff';c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?12:30;c.lineTo(32+Math.cos(a)*r,32+Math.sin(a)*r)}c.closePath();c.fill();t.update();return t})();

function burst(pos,o={}){
  const n=o.n||40,ps=new BABYLON.ParticleSystem('burst',n,scene);
  ps.particleTexture=o.tex||DOT;ps.emitter=pos.clone();
  const b=o.box||.3;ps.minEmitBox=V3(-b,-b*.3,-b);ps.maxEmitBox=V3(b,b*.3,b);
  const s=o.spread??1.2,u=o.up??[1.5,3];ps.direction1=V3(-s,u[0],-s);ps.direction2=V3(s,u[1],s);
  ps.color1=C4(o.c1||'#FFD84D');ps.color2=C4(o.c2||'#FF8A3D');ps.colorDead=C4(o.c2||'#FF8A3D',0);
  ps.minSize=o.size?.[0]??.15;ps.maxSize=o.size?.[1]??.35;ps.minLifeTime=o.life?.[0]??.5;ps.maxLifeTime=o.life?.[1]??1.1;
  ps.minEmitPower=o.power?.[0]??2;ps.maxEmitPower=o.power?.[1]??5;ps.gravity=V3(0,o.grav??-9,0);
  ps.minAngularSpeed=-6;ps.maxAngularSpeed=6;ps.minInitialRotation=0;ps.maxInitialRotation=Math.PI;
  ps.blendMode=o.add?BABYLON.ParticleSystem.BLENDMODE_ADD:BABYLON.ParticleSystem.BLENDMODE_STANDARD;
  ps.manualEmitCount=n;ps.updateSpeed=1/60;ps.start();
  setTimeout(()=>ps.dispose(),((o.life?.[1]??1.1)+.6)*1000);
}

    burst(pos,{n:26,tex:SQ,c1:a,c2:b,size:[.22,.38],life:[1.4,2.2],power:[5,10],grav:-11,up:[2,4],spread:1.6}));

// ---------- kollisjon ----------
const solids=[];
function solidCyl(x,z,r,top,bottom,o={}){const s={type:'cyl',x,z,r,top,bottom,...o};solids.push(s);return s}
function solidBox(x,z,hx,hz,top,bottom,o={}){const s={type:'box',x,z,hx,hz,top,bottom,...o};solids.push(s);return s}
function under(s,x,z,m){if(s.type==='cyl'){const dx=x-s.x,dz=z-s.z;return dx*dx+dz*dz<=(s.r+m)*(s.r+m)}return Math.abs(x-s.x)<=s.hx+m&&Math.abs(z-s.z)<=s.hz+m}

// ---------- byggeklosser ----------
function flat(m){m.convertToFlatShadedMesh();return m}
function island(x,z,top,r,o={}){
  const tess=o.tess||14,depth=o.depth||5.5;
  const g=flat(BABYLON.MeshBuilder.CreateCylinder('grass',{height:.9,diameter:r*2,tessellation:tess},scene));
  g.position.set(x,top-.45,z);g.rotation.y=rnd()*6;g.material=mat(o.grass||'#7ED957');
  const lip=flat(BABYLON.MeshBuilder.CreateCylinder('lip',{height:.5,diameterTop:r*2*1.005,diameterBottom:r*2*.96,tessellation:tess},scene));
  lip.position.set(x,top-1.15,z);lip.rotation.y=g.rotation.y;lip.material=mat(o.lip||'#5FB548');
  const d=flat(BABYLON.MeshBuilder.CreateCylinder('dirt',{height:depth,diameterTop:r*2*.96,diameterBottom:r*.55,tessellation:tess},scene));
  d.position.set(x,top-1.4-depth/2,z);d.rotation.y=g.rotation.y+.2;d.material=mat(o.dirt||'#C58D5C');
  const tip=flat(BABYLON.MeshBuilder.CreateCylinder('tip',{height:depth*.5,diameterTop:r*.55,diameterBottom:0,tessellation:7},scene));
  tip.position.set(x,top-1.4-depth-depth*.25,z);tip.material=mat(o.stone||'#9A8676');
  [g,lip,d].forEach(cast);
  return solidCyl(x,z,r,top,top-1.4-depth,{cp:o.cp?V3(x+(o.cpx||0),top,z+(o.cpz||0)):null,name:o.name});
}
const foliage=[];
function tree(x,z,base,s=1,kind='round'){
  const n=new BABYLON.TransformNode('tree',scene);n.position.set(x,base,z);n.rotation.y=rnd()*6;n.scaling.setAll(s);
  const tr=flat(BABYLON.MeshBuilder.CreateCylinder('trunk',{height:1.6,diameterTop:.32,diameterBottom:.5,tessellation:6},scene));
  tr.parent=n;tr.position.y=.8;tr.material=mat('#8B5A3C');
  if(kind==='pine'){
    const cols=['#2F9E6B','#36A873','#2A8F60'];
    [[2.4,1.7,1.5],[1.9,1.4,2.5],[1.3,1.1,3.4]].forEach(([d,h,y],i)=>{const c=flat(BABYLON.MeshBuilder.CreateCylinder('pine',{height:h,diameterTop:0,diameterBottom:d,tessellation:7},scene));c.parent=n;c.position.y=y;c.rotation.y=i;c.material=mat(cols[i%3]);foliage.push({m:c,ph:x*.3+z*.2+i*.4,a:.03*(i+1)})});
  }else{
    const cols=['#5CC46A','#4DB35E','#79D36F','#8FDB6A'];
    const f=BABYLON.MeshBuilder.CreateIcoSphere('leaf',{radius:1.25,subdivisions:1,flat:true},scene);f.parent=n;f.position.y=2.35;f.scaling.y=.9;f.rotation.set(rnd(),rnd(),rnd());f.material=mat(cols[Math.floor(rnd()*4)]);
    const f2=BABYLON.MeshBuilder.CreateIcoSphere('leaf2',{radius:.75,subdivisions:1,flat:true},scene);f2.parent=n;f2.position.set(.7,2.9,.2);f2.rotation.set(rnd(),rnd(),rnd());f2.material=mat(cols[Math.floor(rnd()*4)]);foliage.push({m:f,ph:x*.3+z*.2,a:.035,b:f.rotation.z},{m:f2,ph:x*.3+z*.2+.6,a:.05,b:f2.rotation.z});
  }
  cast(n);solidCyl(x,z,.42*s,base+4*s,base-.1);return n;
}
function rock(x,z,base,s=1){const m=BABYLON.MeshBuilder.CreateIcoSphere('rock',{radius:.6*s,subdivisions:1,flat:true},scene);m.position.set(x,base+.2*s,z);m.scaling.y=.6;m.rotation.set(rnd(),rnd(),rnd());m.material=mat(rnd()<.5?'#B3BAC4':'#A1A9B5');cast(m);if(s>1.2)solidCyl(x,z,.55*s,base+.45*s,base-1);return m}
const flowerBase={};
function flowers(cx,cz,base,r,n){
  const cols=['#FF6B8A','#FFD84D','#FFFFFF','#B48CFF','#FF9F45'];
  cols.forEach(c=>{if(!flowerBase[c]){const m=BABYLON.MeshBuilder.CreateIcoSphere('fl',{radius:.13,subdivisions:1,flat:true},scene);m.material=mat(c,{em:'#222222'});m.isVisible=false;flowerBase[c]=m}});
  if(!flowerBase.g){const m=BABYLON.MeshBuilder.CreateCylinder('tuft',{height:.35,diameterTop:0,diameterBottom:.22,tessellation:4},scene);m.material=mat('#4FAF45');m.isVisible=false;flowerBase.g=m}
  for(let i=0;i<n;i++){const a=rnd()*6.28,d=Math.sqrt(rnd())*r;const x=cx+Math.cos(a)*d,z=cz+Math.sin(a)*d;
    const g=flowerBase.g.createInstance('t');g.position.set(x,base+.17,z);g.rotation.y=rnd()*3;
    if(rnd()<.55){const f=flowerBase[cols[Math.floor(rnd()*cols.length)]].createInstance('f');f.position.set(x+.08,base+.36,z)}}
}
function cloud(x,y,z,s){
  const n=new BABYLON.TransformNode('cloud',scene);n.position.set(x,y,z);n.scaling.setAll(s);
  [[0,0,0,1.6],[1.5,-.2,.2,1.15],[-1.4,-.25,-.1,1.1],[.5,.6,-.2,1.05],[-.6,.45,.3,.9]].forEach(([a,b,c,r])=>{const m=BABYLON.MeshBuilder.CreateIcoSphere('cl',{radius:r,subdivisions:2,flat:true},scene);m.parent=n;m.position.set(a,b,c);m.scaling.y=.75;m.material=mat('#FFFFFF',{em:'#B9C9DD'})});

function sign(x,base,z,face,draw,o={}){
  const w=o.w||4.2,h=o.h||1.9,ph=o.ph??1.7;
  const n=new BABYLON.TransformNode('sign',scene);n.position.set(x,base,z);n.rotation.y=face;
  for(const sx of (o.single?[0]:[-w/2+.35,w/2-.35])){const p=flat(BABYLON.MeshBuilder.CreateCylinder('post',{height:ph+h,diameter:.22,tessellation:6},scene));p.parent=n;p.position.set(sx,(ph+h)/2,.05);p.material=mat('#8B5A3C')}
  const b=BABYLON.MeshBuilder.CreateBox('board',{width:w,height:h,depth:.18},scene);b.parent=n;b.position.y=ph+h/2;b.material=mat(o.frame||'#A86F43');
  const tw=1024,th=Math.round(1024*h/w);const t=dynTex(tw,th);
  const pl=BABYLON.MeshBuilder.CreatePlane('face',{width:w-.18,height:h-.18},scene);pl.parent=n;pl.position.set(0,ph+h/2,-.1);pl.material=unlit(t);
  const redraw=(...a)=>{const c=t.getContext();c.clearRect(0,0,tw,th);c.fillStyle=o.bg||'#FFF6E3';rrect(c,0,0,tw,th,40);c.fill();draw(c,tw,th,...a);t.update()};
  redraw();cast(n);
  return {node:n,redraw};
}
function textLines(c,w,h,lines,o={}){
  c.textAlign='center';c.textBaseline='middle';
  const total=lines.reduce((s,l)=>s+l.size*1.15,0);let y=h/2-total/2;
  for(const l of lines){c.font=`${l.weight||700} ${l.size}px ${l.emoji?EMOJI:FONT}`;c.fillStyle=l.color||'#3A2616';
    let size=l.size;while(c.measureText(l.t).width>w*.9&&size>20){size-=4;c.font=`${l.weight||700} ${size}px ${FONT}`}
    c.fillText(l.t,w/2,y+l.size*.575);y+=l.size*1.15}
}

function starMesh(R=.5,r=.22,d=.2){
  const pos=[0,0,d,0,0,-d],idx=[];
  for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5,rad=i%2?r:R;pos.push(Math.cos(a)*rad,Math.sin(a)*rad,0)}
  for(let i=0;i<10;i++){const a=2+i,b=2+(i+1)%10;idx.push(0,b,a,1,a,b)}
  const m=new BABYLON.Mesh('star',scene),vd=new BABYLON.VertexData();vd.positions=pos;vd.indices=idx;const nr=[];BABYLON.VertexData.ComputeNormals(pos,idx,nr);vd.normals=nr;vd.applyToMesh(m);
  m.convertToFlatShadedMesh();return m;
}
const starProto=starMesh();starProto.material=mat('#FFC83D',{em:'#8A5A00',spec:.9,pow:40});starProto.material.backFaceCulling=false;starProto.isVisible=false;glowOnly(starProto);

    if(bs&&P.pos.y<=best){if(!wasG&&P.vy<-7){sfx.land();P.sqv=-5;burst(V3(P.pos.x,best+.05,P.pos.z),{n:14,c1:'#FFFFFF',c2:'#DDE6F0',size:[.2,.45],life:[.35,.6],power:[1.5,3],grav:0,up:[.1,.3],spread:2})}
      P.pos.y=best;P.vy=0;P.grounded=true;P.dbl=false;P.ground=bs;P.coyote=.12;if(bs.cp)P.cp.copyFrom(bs.cp)}
    else{P.grounded=false;P.ground=null}
    if(P.pos.y<-11)respawn();
    // svarputer
    let onPad=null;
    for(const S of stations)for(const p of S.pads)if(P.ground===p.solid)onPad={S,p};
    if(onPad&&P.lastPad!==onPad.p){P.lastPad=onPad.p;if(onPad.S.q)onPad.S.answer(onPad.p)}
    if(!onPad)P.lastPad=null;
    // soner
    for(const S of stations){const d=Math.hypot(P.pos.x-S.cx,P.pos.z-S.cz);const inZ=d<S.r+.3&&P.pos.y>S.top-1.5;
      if(inZ&&!S.inZone){S.inZone=true;if(!S.started||S.needsReset)S.start();else updateQuizHud(S)}
      else if(!inZ&&S.inZone){S.inZone=false;if(hudStation===S)updateQuizHud(null)}}
    // stjerner
    for(const c of coins){if(c.taken)continue;const dx=P.pos.x-c.m.position.x,dy=P.pos.y+1-c.m.position.y,dz=P.pos.z-c.m.position.z;
      if(dx*dx+dy*dy+dz*dz<1.7){c.taken=true;addXP(1);combo=(time-lastPick<1.6)?Math.min(combo+1,12):0;lastPick=time;sfx.star(combo);flyStar(c.m.position);burst(c.m.position,{n:18,tex:STAR_T,c1:'#FFF6C2',c2:'#FFC83D',add:true,size:[.15,.3],life:[.4,.8],power:[2,4],grav:-3});
        const m=c.m;tween(.25,k=>{m.scaling.setAll(1+k*.6);m.position.y+=dt*6},()=>m.setEnabled(false))}}
    if(!shopOpen)for(const c of chests)if(!c.open&&Math.hypot(P.pos.x-c.x,P.pos.z-(c.z-0))<2.9&&Math.abs(P.pos.y-c.top)<1.5)openChest(c);
    for(const p of portals)if(Math.hypot(P.pos.x-p.x,P.pos.z-p.z)<1.3&&Math.abs(P.pos.y-p.top-.3)<1.2)teleportHome();
    for(const c of chests)if(c.open&&Math.hypot(P.pos.x-c.x,P.pos.z-c.z)>12)c.open=false,c.lidPiv.rotation.x=0,c.glowRing.setEnabled(true);
  }
  // figur-animasjon
  const hs=Math.hypot(P.vel.x,P.vel.z),run=Math.min(1,hs/SPEED);
  if(hs>.6){const ty=Math.atan2(P.vel.x,P.vel.z);let d=ty-P.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));P.yaw+=d*Math.min(1,dt*14)}
  P.phase+=dt*hs*1.55;
  const sw=P.grounded?Math.sin(P.phase)*run*.95:0;
  const air=P.grounded?0:1;
  P.legL.rotation.x=lerp(P.legL.rotation.x,sw+air*-.45,.35);P.legR.rotation.x=lerp(P.legR.rotation.x,-sw+air*.25,.35);
  P.armL.rotation.x=lerp(P.armL.rotation.x,-sw*.85+air*-2.6,.3);P.armR.rotation.x=lerp(P.armR.rotation.x,sw*.85+air*-2.6,.3);
  P.armL.rotation.z=lerp(P.armL.rotation.z,air*-.35,.3);P.armR.rotation.z=lerp(P.armR.rotation.z,air*.35,.3);
  P.sqv+=((1-P.sq)*220-P.sqv*14)*dt;P.sq+=P.sqv*dt;const sq=clamp(P.sq,.7,1.35);
  P.body.scaling.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
  P.body.position.y=P.grounded?Math.abs(Math.sin(P.phase))*.1*run+Math.sin(time*2.2)*.015*(1-run):0;
  P.headPiv.rotation.x=Math.sin(time*1.7)*.03;
  P.root.position.copyFrom(P.pos);P.root.rotation.y=P.yaw;
  P.blinkT-=dt;if(P.blinkT<0){P.drawFace(true);setTimeout(()=>P.drawFace(false),120);P.blinkT=rr(2.5,5)}
  if(P.grounded&&hs>2){stepT-=dt*hs;if(stepT<0){stepT=2.2;sfx.step(P.ground&&P.ground.srf)}}
  dust.emitter.copyFrom(P.pos);dust.emitRate=(P.grounded&&hs>5.5)?22:0;
  updateAmbience(dt,P);updateGear(dt,P,hs);
  {const p=P.pos,w=worldAt(p)||WORLDS.find(w=>{const t=p.x*w.ux+p.z*w.uz,q=Math.abs(-p.x*w.uz+p.z*w.ux);return t>10.5&&t<w.dA&&q<4});wantTheme=w?w.theme:'hub'}
  updateGuide(dt);for(const b of blinkers)b.setEnabled(Math.sin(time*5)>0);if(dinoNeck)dinoNeck.rotation.x=Math.sin(time*.9)*.18;
  for(const f of foliage)f.m.rotation.z=(f.b||0)+Math.sin(time*1.4+f.ph)*f.a;
  for(const f of flies){f.ph+=dt*f.sp;const a=f.ph;f.n.position.set(f.cx+Math.cos(a)*f.r+Math.sin(a*2.3)*.7,f.base+f.h+Math.sin(a*3.1)*.35,f.cz+Math.sin(a)*f.r);f.n.rotation.y=-a+(f.sp>0?0:Math.PI);const fl=Math.sin(time*f.fl+f.ph)*1.1;f.wings[0].rotation.z=-fl;f.wings[1].rotation.z=fl}
  // kamera
  const k=1-Math.exp(-dt*9);
  cam.target.x=lerp(cam.target.x,P.pos.x,k);cam.target.y=lerp(cam.target.y,P.pos.y+1.6,k*.7);cam.target.z=lerp(cam.target.z,P.pos.z,k);
  if(!started)cam.alpha+=dt*.06;
  sun.position.copyFrom(cam.target.subtract(sun.direction.scale(60)));
  // pynt-animasjon
  for(const c of coins)if(!c.taken){c.m.rotation.y=time*2.4+c.ph;c.m.position.y=c.y+Math.sin(time*2.6+c.ph)*.15}
  for(const p of portals){p.ring.rotation.z=time*.8;p.disc.rotation.z=-time*1.4}
  clouds.forEach((c,i)=>{c.position.x+=dt*(.4+i%3*.15);if(c.position.x>110)c.position.x=-110});
  waterTex.uOffset+=dt*.004;waterTex.vOffset+=dt*.0025;
  ship.position.y=-14.2+Math.sin(time*.9)*.12;ship.rotation.z=Math.sin(time*.7)*.03;
  if(fireLight)fireLight.intensity=.7+Math.sin(time*13)*.12+Math.sin(time*7.3)*.1;
  for(const c of chests)if(!c.open)c.glowRing.scaling.setAll(1+Math.sin(time*3)*.05);
}
// ---------- nivå og garderobe ----------
// Tale som venter til det er stille, så den ikke avbryter et spørsmål.
const sayQueue=[];let quietFor=0;
function sayWhenQuiet(t){sayQueue.push(t)}
setInterval(()=>{let busy=false;try{busy=speechSynthesis.speaking||speechSynthesis.pending}catch(e){}
  quietFor=busy?0:quietFor+.25;if(sayQueue.length&&quietFor>=.75&&!shopOpen){say(sayQueue.shift());quietFor=0}},250);
let toastBusyUntil=0;
const _toast=toast;toast=function(a,b){toastBusyUntil=performance.now()+1900;_toast(a,b)};
function toastWhenFree(a,b,cb){const w=Math.max(0,toastBusyUntil-performance.now())+150;toastBusyUntil=performance.now()+w+1900;setTimeout(()=>{_toast(a,b);cb&&cb()},w)}
const lvlEl=$('#lvl'),lvlN=$('#lvl b'),lvlBar=$('#lvl .bar i');
let curLvl=lvlInfo(save.xp).L;
function renderLvl(){const i=lvlInfo(save.xp);lvlN.textContent=i.L;lvlBar.style.width=(i.L>=LVL_MAX?100:Math.round(i.x/i.n*100))+'%';
  lvlEl.setAttribute('aria-label','Nivå '+i.L);if(shopOpen)renderShopHead()}
renderLvl();
function addXP(n){if(!n)return;save.xp+=n;persist();renderLvl();const i=lvlInfo(save.xp);
  if(i.L>curLvl){const from=curLvl;curLvl=i.L;levelUp(i.L,from)}}
function levelUp(L,from){
  const fresh=ITEMS.filter(it=>it.p&&it.lv>from&&it.lv<=L);
  lvlEl.classList.remove('lvup');void lvlEl.offsetWidth;lvlEl.classList.add('lvup');
  toastWhenFree('Nivå '+L+'! 🎉',fresh.length?'Nytt i garderoben: '+fresh.map(f=>f.e).join(' '):titleOf(L),()=>{
    sfx.fanfare();burst(player.pos.add(V3(0,1.5,0)),{n:50,tex:STAR_T,c1:'#FFF1A8',c2:'#FFC83D',add:true,up:[3,6],spread:1,power:[2,5],grav:-3,life:[.8,1.4]});
    tween(.6,k=>{player.sq=1+Math.sin(k*Math.PI)*.25});addStars(5)});
  const tt=TITLES.find(t=>t[0]===L);
  sayWhenQuiet(`Nytt nivå! Du er nivå ${sayNum(L)}${tt?', og nå er du '+tt[1].toLowerCase():''}. Du fikk fem stjerner.`+(fresh.length?` Nytt utstyr i garderoben: ${fresh.map(f=>f.n.toLowerCase()).join(', ')}.`:''));
  refreshShopBadge();
}
lvlEl.addEventListener('click',()=>{initAudio();const i=lvlInfo(save.xp);say(`Du er nivå ${sayNum(i.L)}, ${titleOf(i.L).toLowerCase()}.`+(i.L<LVL_MAX?' Svar riktig og samle stjerner for å nå neste nivå.':' Det er høyeste nivå!'))});

const shopBtn=$('#shopBtn'),shopEl=$('#shop'),grid=$('#shop .grid'),tabsEl=$('#shop .tabs');
let shopSlot='hat',confirmId=null,camSave=null;
const canBuy=it=>it.p>0&&!it.chest&&!owns(it)&&curLvl>=it.lv&&save.stars>=it.p;
function refreshShopBadge(){const any=ITEMS.some(canBuy);shopBtn.classList.toggle('new',any);
  if(any&&!save.shopHint&&started){save.shopHint=1;persist();setTimeout(()=>{toastWhenFree('Du kan kjøpe utstyr! 👕','Trykk på genseren oppe til høyre');sayWhenQuiet('Du har nok stjerner til å kjøpe noe! Trykk på genseren oppe til høyre for å åpne garderoben.')},1200)}}
const refreshHatBtn=refreshShopBadge;
SLOTS.forEach(s=>{const b=document.createElement('button');b.className='tab';b.dataset.slot=s.k;b.setAttribute('role','tab');b.innerHTML=`<span aria-hidden="true">${s.e}</span>${s.n}`;
  b.addEventListener('click',()=>{shopSlot=s.k;confirmId=null;renderShop();sfx.click();say(s.n)});tabsEl.append(b)});
function renderShopHead(){const i=lvlInfo(save.xp);$('#shop .sstars .n').textContent=save.stars;
  $('#shop .slvl .lv').textContent='Nivå '+i.L;$('#shop .slvl .tt').textContent=titleOf(i.L);
  $('#shop .slvl .bar i').style.width=(i.L>=LVL_MAX?100:Math.round(i.x/i.n*100))+'%'}
function renderShop(){
  renderShopHead();
  [...tabsEl.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.slot===shopSlot));
  grid.innerHTML='';
  for(const it of ITEMS.filter(i=>i.slot===shopSlot)){
    const on=save[shopSlot]===it.id,have=owns(it),key=it.slot+':'+it.id;
    const st=on?'on':have?'owned':it.chest?'chest':curLvl<it.lv?'locked':save.stars<it.p?'poor':confirmId===key?'confirm':'buy';
    const b=document.createElement('button');b.className='item '+st;
    const lab={on:'På deg ✓',owned:'Ta på',chest:'🎁 I kiste',locked:'🔒 Nivå '+it.lv,poor:'⭐ '+it.p,buy:'⭐ '+it.p,confirm:'Kjøp? ⭐ '+it.p}[st];
    b.innerHTML=`<span class="ic" aria-hidden="true">${it.e}</span><span class="nm"></span><span class="st">${lab}</span>`;b.querySelector('.nm').textContent=it.n;
    b.addEventListener('click',()=>tapItem(it,st,b));grid.append(b);
  }
}
function tapItem(it,st,b){
  const key=it.slot+':'+it.id;
  if(st==='on'){if(it.id&&it.slot!=='shirt'){equip(it.slot,'');say('Du tok av '+it.n.toLowerCase()+'.')}else say(it.n+'. Den har du på deg.');return}
  if(st==='owned'){equip(it.slot,it.id);say(it.n+'!'+(it.perk?' '+it.perk:''));return}
  if(st==='chest'){wiggle(b);say(`${it.n}. Den finner du i skattekista i ${it.chest}.`);return}
  if(st==='locked'){wiggle(b);say(`${it.n}. Den får du på nivå ${sayNum(it.lv)}.`);return}
  if(st==='poor'){wiggle(b);const m=it.p-save.stars;say(`${it.n} koster ${it.p} stjerner. Du trenger ${m===1?'én':m} til.`);return}
  if(st==='buy'){confirmId=key;renderShop();sfx.click();say(`${it.n} koster ${it.p} stjerner. Trykk en gang til for å kjøpe.`+(it.perk?' '+it.perk:''));return}
  if(st==='confirm'){confirmId=null;save.stars-=it.p;save.owned.push(key);starsN.textContent=save.stars;persist();
    equip(it.slot,it.id);sfx.fanfare();confetti(player.pos.add(V3(0,2.2,0)));tween(.6,k=>{player.sq=1+Math.sin(k*Math.PI)*.2});
    say(`Du kjøpte ${it.n.toLowerCase()}!`+(it.perk?' '+it.perk:''));refreshShopBadge()}
}
function wiggle(b){b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');sfx.wrong&&tone(220,{d:.12,v:.05})}
function equip(slot,id){if(slot==='hat')wearHat(id);else{save[slot]=id;persist();applyGear()}player.sqv=-3;sfx.pop(3);renderShop()}
function openShop(){if(shopOpen)return;initAudio();shopOpen=true;confirmId=null;shopEl.hidden=false;renderShop();sfx.pop(2);updateQuizHud(null);
  camSave={beta:cam.beta,radius:cam.radius};const P=player,ta=Math.atan2(Math.cos(P.yaw),Math.sin(P.yaw));let da=ta-cam.alpha;da=Math.atan2(Math.sin(da),Math.cos(da));
  const a0=cam.alpha,b0=cam.beta,r0=cam.radius,wide=innerWidth>=700;tween(.6,k=>{const e=easeOut(k);cam.alpha=a0+da*e;cam.beta=lerp(b0,1.38,e);cam.radius=lerp(r0,wide?7:8.5,e);
    cam.targetScreenOffset.x=lerp(0,wide?-2.6:0,e);cam.targetScreenOffset.y=lerp(0,wide?0:-1.6,e)});
  say('Garderoben. Trykk på noe for å høre hva det er.')}
function closeShop(){if(!shopOpen)return;shopOpen=false;shopEl.hidden=true;sfx.pop(1);const b0=cam.beta,r0=cam.radius,ox=cam.targetScreenOffset.x,oy=cam.targetScreenOffset.y;
  tween(.5,k=>{const e=easeOut(k);cam.beta=lerp(b0,camSave?camSave.beta:1.1,e);cam.radius=lerp(r0,camSave?camSave.radius:14,e);cam.targetScreenOffset.x=ox*(1-e);cam.targetScreenOffset.y=oy*(1-e)});
  for(const S of stations)if(S.inZone&&S.q)updateQuizHud(S);canvas.focus()}
shopBtn.addEventListener('click',()=>shopOpen?closeShop():openShop());
$('#shop .sclose').addEventListener('click',closeShop);
addEventListener('keydown',e=>{if(e.code==='Escape'&&shopOpen)closeShop()});
refreshShopBadge();

player.pos.set(0,0,-4);snapCam();
engine.runRenderLoop(()=>{const dt=Math.min(engine.getDeltaTime()/1000,DT_MAX);update(dt);scene.render()});
addEventListener('resize',()=>engine.resize());

// ---------- start ----------
if(KID){$('.kids').hidden=true;$('.sub').textContent='Hei '+(KID==='bastian'?'Bastian':'Benjamin')+'! Riktige svar gir '+(KID==='bastian'?'stjerner':'poeng')+' i appen din.'}
document.querySelectorAll('.kid').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.kid===save.kid);b.addEventListener('click',()=>{document.querySelectorAll('.kid').forEach(x=>x.setAttribute('aria-pressed',x===b));setKid(b.dataset.kid);player.sqv=-4})});
$('#goBtn').addEventListener('click',()=>{initAudio();try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
  $('#start').hidden=true;started=true;cam.alpha=-Math.PI/2;cam.beta=1.1;cam.radius=14;canvas.focus();
  toast('Blokkøya!','Velg en vei');sfx.fanfare();say('Hei '+(save.kid==='bastian'?'Bastian':'Benjamin')+'! Velkommen til Blokkøya. Gå til Ordskogen eller Vikingbyen.')});
window.__blokk={dtMax:v=>DT_MAX=v,player,stations,chests,coins,setStarted:v=>started=v,teleport:(x,y,z)=>{player.pos.set(x,y,z);player.vel.set(0,0,0);player.vy=0;snapCam()},cam,save,openShop,closeShop,addXP,WORLDS,equip,giveCrystal,openChest,unlockWorld};
})();
</script>
